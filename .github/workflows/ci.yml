name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lane 6 (Quality, Security, Release & Evidence) owns this file --
# SIH26101_TEAM_ORCHESTRATION.md section 5, Lane 6 immediate package.
#
# What this currently covers: backend pytest, frontend lint + production build, and a JSON
# well-formedness check on the docs/contracts/openapi.json scaffold.
#
# What this deliberately does NOT cover yet (open items, not silently skipped):
#   - Cross-domain Playwright/E2E smoke (SIH26101_MASTER_CHECKLIST.md 3.2) -- Playwright is not
#     installed in this repo yet; adding it is Lane 1/Lane 6 work, not assumed done here.
#   - Dependency/secret/SAST/DAST scans and SBOM (SIH26101_MASTER_CHECKLIST.md 5.3).
#   - Any deployment step -- there is no deploy target defined yet (see /deploy).

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: prism
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prism -d prism"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://prism:prism@localhost:5432/prism
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run backend test suite
        run: python -m pytest -v

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  contract-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate docs/contracts/openapi.json is well-formed JSON
        run: python -c "import json; json.load(open('docs/contracts/openapi.json', encoding='utf-8'))"
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check for hardcoded secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep SAST
        # avoid-sqlalchemy-text is excluded, not left to per-line `# nosemgrep`
        # comments: it's a taint-mode rule, and confirmed directly (this
        # exact Semgrep version, this exact rule) that per-line nosemgrep
        # comments are not honored for it, unlike ordinary pattern rules. The
        # two flagged call sites are backend/db/database.py::ensure_columns()
        # -- see that function's own docstring for why they're genuinely
        # safe (every value is validated against a strict identifier/shape
        # regex before interpolation, and PRAGMA/ALTER COLUMN have no
        # parameterized-identifier alternative in SQLite). Re-run
        # `semgrep --config=auto --error` locally without this flag before
        # ever removing it, to confirm the underlying Semgrep version still
        # can't suppress it per-line.
        run: semgrep --config=auto --error --exclude-rule=python.sqlalchemy.security.audit.avoid-sqlalchemy-text.avoid-sqlalchemy-text