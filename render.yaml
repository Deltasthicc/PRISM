# Render Blueprint for PRISM's shared backend + frontend + shared
# local-standards OIDC provider. Deploy: push this file to `main`, then in
# the Render dashboard choose "New > Blueprint" and point it at this
# repo/branch.
#
# What this does NOT cover: the database (Neon is provisioned separately --
# Render can't create a Neon project for you; paste its connection string in
# as DATABASE_URL below). Neither Keycloak here, the backend, nor the
# frontend is a government-approved production system -- see
# SIH26101_MASTER_CHECKLIST.md 5.1.
#
# The frontend service below needs one manual step after first deploy: once
# prism-backend has its own real onrender.com hostname, paste
# `https://<that hostname>` into prism-frontend's NEXT_PUBLIC_API_URL env var
# (Render prompts for every `sync: false` value below, but this one has a
# circular dependency -- the backend's URL doesn't exist until it's deployed
# once -- so it can't be filled in automatically on the very first blueprint
# run). Everyone can still run the frontend per-laptop via `npm run dev`
# pointed at either URL; this hosted copy is an additional, not a
# replacement, option.
#
# Every `sync: false` env var below has no value in this file on purpose --
# Render will prompt for it once during blueprint creation and store it as a
# secret from then on; it is never committed to the repo.

services:
  # ── Shared FastAPI backend ──────────────────────────────────────────────
  - type: web
    name: prism-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python -m alembic upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Without this, Render picks whatever Python it currently defaults new
      # services to -- confirmed live to be 3.14, which has no prebuilt wheel
      # yet for pydantic-core==2.23.4, so pip falls back to compiling it from
      # Rust source via maturin and fails outright (Render's build sandbox
      # has a read-only Cargo cache directory). 3.11 is what this repo's own
      # CI already runs backend-tests against (.github/workflows/ci.yml) and
      # was independently verified this session: a fresh Python 3.11 venv
      # installing straight from requirements.txt, full test suite green.
      # backend/.python-version pins the same version as a second signal, in
      # case Render's buildpack checks that instead of/before this env var.
      - key: PYTHON_VERSION
        value: 3.11.9
      # Neon's connection string, e.g.
      # postgresql://user:password@ep-xxxx.neon.tech/prism?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Must exactly equal the deployed Keycloak service's public issuer URL:
      # https://<prism-keycloak's real Render hostname>/realms/prism
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        value: prism-backend-dev
      # Every origin allowed to call this API with credentials -- teammates'
      # local frontends (still fine to run via `npm run dev`, pointed at this
      # shared backend instead of localhost:8000) plus the hosted
      # prism-frontend service below. Add prism-frontend's real
      # onrender.com hostname here once it's deployed (this has the same
      # first-deploy circular-dependency caveat as NEXT_PUBLIC_API_URL
      # below), and any new contributor's local port if it's ever not the
      # Next.js default.
      - key: FRONTEND_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: SEED_DEMO_DATA
        value: "false"
      # DEMO MODE: bypasses real bearer-token verification entirely (see
      # backend/routes/authorization.py's _DEMO_AUTH_DISABLED) so a username
      # alone is enough to act as that player -- no Keycloak round trip, no
      # cold-start wait. This grants every request full access; there is no
      # real identity behind any call while this is set. Unset (or "false")
      # to restore full OIDC/Keycloak verification with zero code changes.
      - key: DISABLE_AUTH
        value: "true"
      # Bridges the demo username login to a real Keycloak token for
      # everyone automatically -- see routes/dev_auth.py's docstring. This is
      # still not the real browser OIDC/PKCE flow (README.md,
      # SIH26101_MASTER_CHECKLIST.md 5.1); it's what makes a *shared*
      # deployment usable today without that flow existing yet.
      - key: ENABLE_DEV_LOGIN
        value: "true"
      # Must equal https://<prism-keycloak's real hostname>/realms/prism/protocol/openid-connect/token
      - key: KEYCLOAK_DEV_TOKEN_URL
        sync: false
      - key: KEYCLOAK_DEV_CLIENT_ID
        value: prism-backend-dev
      - key: KEYCLOAK_DEV_CLIENT_SECRET
        sync: false
      - key: KEYCLOAK_DEV_USERNAME
        value: demo-learner
      - key: KEYCLOAK_DEV_PASSWORD
        sync: false

  # ── Shared local-standards OIDC provider (Keycloak) ─────────────────────
  - type: web
    name: prism-keycloak
    runtime: docker
    plan: free
    rootDir: backend/keycloak
    dockerfilePath: ./Dockerfile
    envVars:
      # Matches docker-compose.dev.yml's already-correct names (KEYCLOAK_ADMIN/
      # KEYCLOAK_ADMIN_PASSWORD are deprecated -- confirmed by this image's own
      # boot log, "KC-SERVICES0110").
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Render assigns this at creation time (usually
      # prism-keycloak-<random>.onrender.com, or exactly prism-keycloak.onrender.com
      # if that name is free) -- the Dockerfile's placeholder value must be
      # overridden here with whatever Render actually assigns, or every
      # issued token's `iss` claim will be wrong and OIDC_ISSUER above will
      # never match it.
      - key: KC_HOSTNAME
        sync: false

  # ── Frontend (Next.js, server-rendered -- see the file's own top comment
  #    for the one manual step this needs after first deploy) ─────────────
  - type: web
    name: prism-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    # `next start` reads Render's assigned $PORT automatically -- no
    # explicit --port flag needed (confirmed: Next.js CLI falls back to
    # process.env.PORT when none is passed).
    startCommand: npm run start
    envVars:
      # Pins the same Node major this repo's package.json already requires
      # (engines.node >= 22.13) -- without this, Render picks its own
      # current default, which may not satisfy that constraint.
      - key: NODE_VERSION
        value: 22.13.0
      # See this file's top comment: fill this in with
      # https://<prism-backend's real onrender.com hostname> once that
      # service exists -- it can't be known before prism-backend's first
      # deploy, so Render can't prompt for it up front the way every other
      # sync: false value here is prompted for.
      - key: NEXT_PUBLIC_API_URL
        sync: false
